<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skin Study</title>
  <meta name="description" content="Three ways to light a face: flat polygons, texture and bump maps, and point-based subsurface scattering with a dipole diffusion profile. Drag the light behind her ear.">
  <meta property="og:title" content="Skin Study">
  <meta property="og:description" content="Three ways to light a face: flat polygons, texture and bump maps, and point-based subsurface scattering with a dipole diffusion profile.">
  <meta property="og:image" content="https://chanian.github.io/gotoandstop/skin-study/thumb.jpg">
  <meta property="og:url" content="https://chanian.github.io/gotoandstop/skin-study/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --panel: rgba(20, 16, 15, 0.66);
      --line: rgba(255, 228, 214, 0.14);
      --text: #f3e8e1;
      --muted: rgba(243, 232, 225, 0.58);
      --accent: #ff8f7a;
      --pad: 128px;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); }
    body {
      font: 13px/1.4 Inter, system-ui, sans-serif;
      background: radial-gradient(ellipse 70% 80% at 55% 40%, #2a2220 0%, #141010 55%, #080606 100%);
    }
    canvas#view { display: block; touch-action: none; }

    #title { position: fixed; left: 20px; top: 16px; pointer-events: none; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); max-width: 360px; }
    #title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    #title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    #back { position: fixed; left: 20px; bottom: 16px; color: var(--muted); text-decoration: none; font-size: 12px; z-index: 5; }
    #back:hover { color: var(--text); }
    #credit { position: fixed; left: 130px; bottom: 16px; color: rgba(243, 232, 225, .35); font-size: 11px; z-index: 5; }
    #credit a { color: inherit; }
    body.clean #ui, body.clean #status, body.clean .lil-gui.root, body.clean #title, body.clean #back, body.clean #credit, body.clean #split { display: none !important; }

    #ui {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 20px; padding: 12px 18px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
      backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .35); user-select: none; -webkit-user-select: none;
    }
    .modes { display: flex; flex-direction: column; gap: 6px; min-width: 190px; }
    .modes .label, .light .label, .plot .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    button {
      font: 500 12px Inter, system-ui, sans-serif; color: var(--text); background: rgba(255, 228, 214, .06);
      border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
      transition: background .2s, border-color .2s, color .2s; text-align: left;
    }
    button:hover { background: rgba(255, 228, 214, .12); }
    button.on { background: rgba(255, 143, 122, .2); border-color: rgba(255, 143, 122, .6); color: #ffe1d8; }
    .modes button b { font: 600 11px 'JetBrains Mono', monospace; color: var(--accent); margin-right: 8px; }
    .modes .row { display: flex; gap: 6px; }
    .modes .row button { flex: 1; text-align: center; padding: 5px 8px; font-size: 11px; }

    .light { display: flex; gap: 12px; align-items: center; }
    .pad { position: relative; width: var(--pad); height: var(--pad); border-radius: 50%; cursor: grab; touch-action: none;
      background: radial-gradient(circle closest-side, rgba(255, 236, 220, .10), rgba(255, 236, 220, .03) 50%, rgba(0, 0, 0, .25) 51%, rgba(0, 0, 0, .35) 100%);
      box-shadow: inset 0 0 0 1px var(--line); }
    .pad.active { cursor: grabbing; }
    .pad .ring { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; border-radius: 50%; border: 1px dashed rgba(255, 236, 220, .22); pointer-events: none; }
    .pad .face { position: absolute; left: 50%; top: 50%; width: 20px; height: 26px; transform: translate(-50%, -50%); border-radius: 50% 50% 46% 46%;
      border: 1px solid rgba(255, 236, 220, .45); pointer-events: none; }
    .pad .tag { position: absolute; font-size: 9px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; pointer-events: none; transform: translate(-50%, -50%); }
    .pad .orb { position: absolute; width: 18px; height: 18px; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 40% 40%, #fffaf0, #ffd9a8 60%, #ffb070);
      box-shadow: 0 0 14px 4px rgba(255, 200, 140, .5), 0 0 0 2px rgba(20, 14, 10, .5); }
    .pad .orb.behind { opacity: .6; box-shadow: 0 0 10px 2px rgba(255, 120, 90, .45), 0 0 0 2px rgba(20, 14, 10, .5); }
    .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .presets button { padding: 5px 9px; font-size: 11px; text-align: center; }

    .plot { display: flex; flex-direction: column; gap: 4px; }
    .plot canvas { width: 170px; height: 96px; border-radius: 8px; background: rgba(0, 0, 0, .25); box-shadow: inset 0 0 0 1px var(--line); }
    .plot .caption { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

    #status {
      position: fixed; right: 20px; bottom: 22px; z-index: 5;
      display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-variant-numeric: tabular-nums;
    }
    #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    #split { position: fixed; top: 0; bottom: 0; width: 0; z-index: 3; display: none; }
    #split.on { display: block; }
    #split .bar { position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: rgba(255, 236, 220, .55); box-shadow: 0 0 10px rgba(0, 0, 0, .5); }
    #split .grip { position: absolute; top: 50%; left: -17px; width: 34px; height: 34px; margin-top: -17px; border-radius: 50%; cursor: ew-resize;
      background: rgba(20, 16, 15, .85); border: 1px solid rgba(255, 236, 220, .5); display: grid; place-items: center; color: var(--text); touch-action: none; }
    #split .side { position: absolute; top: 64px; font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .04em; color: var(--text);
      background: rgba(20, 16, 15, .7); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
    #split .side.l { right: 14px; }
    #split .side.r { left: 14px; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255, 210, 190, .75); z-index: 20;
      font-size: 12px; letter-spacing: .16em; text-transform: uppercase; transition: opacity .8s; pointer-events: none; }
    #loading.gone { opacity: 0; }
    .lil-gui.root { --background-color: rgba(22, 17, 16, .88); --title-background-color: rgba(34, 26, 24, .92); --widget-color: #3a2e2b;
      --hover-color: #4a3b37; --focus-color: #574541; --number-color: #ff9f8c; --width: 270px; }

    @media (max-width: 820px) {
      :root { --pad: 104px; }
      #ui { gap: 12px; padding: 10px 12px; bottom: 44px; border-radius: 18px; max-width: calc(100vw - 32px); box-sizing: border-box; }
      .plot { display: none; }
      .modes { min-width: 0; }
      .presets { grid-template-columns: 1fr; }
      #status { bottom: auto; top: 40px; left: 16px; right: auto; padding: 5px 10px; font-size: 11px; }
      #title p { display: none; }
      #credit { display: none; }
    }
    @media (max-width: 560px) {
      .light .presets { display: none; }
      .modes button { padding: 6px 9px; font-size: 11px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="title">
    <h1>Skin Study</h1>
    <p>Three ways to light a face. Drag the light around her, or behind her ear, and watch the light bleed through.</p>
  </div>
  <canvas id="view"></canvas>
  <div id="split"><div class="bar"></div><span class="side l" id="splitL"></span><span class="side r" id="splitR"></span>
    <div class="grip" id="grip"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M5 3 1 7l4 4M9 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div id="ui"></div>
  <div id="status"></div>
  <div id="loading">Loading the head…</div>
  <a id="back" href="../">&larr; gotoAndStop</a>
  <span id="credit">Head: <a href="https://github.com/microsoft/Microsoft-Rocketbox">Microsoft Rocketbox</a> (MIT)</span>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
