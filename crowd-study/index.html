<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crowd Study</title>
  <meta name="description" content="Push a crash-test dummy through a crowd of them. Rigid-disc contacts, a balance spring that tips people over, and ragdolls when they go down.">
  <meta property="og:title" content="Crowd Study">
  <meta property="og:description" content="Push a crash-test dummy through a crowd of them. Click to walk, hold Shift to run.">
  <meta property="og:image" content="https://chanian.github.io/gotoandstop/crowd-study/thumb.jpg">
  <meta property="og:url" content="https://chanian.github.io/gotoandstop/crowd-study/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e6e3dd;
      --panel: rgba(250, 248, 245, 0.78);
      --line: rgba(40, 34, 28, 0.12);
      --text: #2a2622;
      --muted: rgba(42, 38, 34, 0.55);
      --accent: #ff6a2b;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); background: var(--bg); }
    body { font: 13px/1.4 Inter, system-ui, sans-serif; }
    canvas#view { display: block; touch-action: none; cursor: crosshair; }

    #title { position: fixed; left: 20px; top: 16px; pointer-events: none; max-width: 380px; }
    #title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    #title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    #back { position: fixed; left: 20px; bottom: 16px; color: var(--muted); text-decoration: none; font-size: 12px; z-index: 5; }
    #back:hover { color: var(--text); }
    body.clean #ui, body.clean #status, body.clean #title, body.clean #back, body.clean #hint { display: none !important; }

    #ui {
      position: fixed; right: 16px; top: 16px; width: 248px; padding: 14px 16px 12px; box-sizing: border-box;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 10px 40px rgba(60, 45, 30, .12); user-select: none; -webkit-user-select: none;
      max-height: calc(100vh - 32px); overflow-y: auto;
    }
    #ui .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    #ui .group + .group { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; margin-bottom: 7px; }
    .row span { font-size: 12px; }
    .row output { font: 11px 'JetBrains Mono', monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
    .row input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 16px; }
    .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .btns.three { grid-template-columns: repeat(3, 1fr); }
    button {
      font: 500 12px Inter, system-ui, sans-serif; color: var(--text); background: rgba(40, 34, 28, .04);
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
      transition: background .2s, border-color .2s, color .2s;
    }
    button:hover { background: rgba(40, 34, 28, .09); }
    button.on { background: rgba(255, 106, 43, .14); border-color: rgba(255, 106, 43, .6); color: #b8410c; }
    button kbd { font: 10px 'JetBrains Mono', monospace; color: var(--muted); margin-left: 4px; }

    #status {
      position: fixed; right: 16px; bottom: 16px; z-index: 5;
      display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-variant-numeric: tabular-nums;
    }
    #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    #status b { color: var(--text); font-weight: 500; }

    #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px;
      background: rgba(42, 38, 34, .82); color: #f6f2ec; font-size: 12px; pointer-events: none; transition: opacity .8s; white-space: nowrap; }
    #hint.gone { opacity: 0; }
    #hint b { color: #ffb48f; font-weight: 500; }

    /* the drawer header: click to collapse the panel down to just this row */
    #toggle {
      display: flex; align-items: center; justify-content: space-between; width: 100%; margin: -2px 0 12px;
      padding: 0; border: 0; background: none; border-radius: 0; font: 600 12px Inter, system-ui, sans-serif;
      letter-spacing: .02em; color: var(--text);
    }
    #toggle:hover { background: none; color: #b8410c; }
    #toggle svg { transition: transform .2s; }
    #ui.closed { width: auto; padding: 10px 14px; }
    #ui.closed > .group { display: none; }
    #ui.closed #toggle { margin: 0; gap: 10px; }
    #ui.closed #toggle svg { transform: rotate(-90deg); }
    @media (max-width: 720px) {
      #title p { display: none; }
      #ui { top: auto; bottom: 56px; right: 12px; left: 12px; width: auto; max-height: 46vh; }
      #ui.closed { width: auto; left: auto; }
      #status { bottom: auto; top: 42px; left: 16px; right: auto; padding: 5px 10px; font-size: 11px; }
      #back { bottom: 20px; }
      #ui { bottom: 46px; }
      #hint { bottom: auto; top: 82px; font-size: 11px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="title">
    <h1>Crowd Study</h1>
    <p>One orange dummy, a crowd of grey ones. Click to walk through them, hold Shift to run. They make way if they see you coming. If they don't, they get shoved.</p>
  </div>
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="status"></div>
  <div id="hint">Click to walk &middot; drag to steer &middot; hold <b>Shift</b> to run</div>
  <a id="back" href="../">&larr; gotoAndStop</a>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
